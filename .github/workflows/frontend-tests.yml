name: Frontend Tests

on:
  push:
    paths:
      - 'ecommerce-app/**'
  pull_request:
    paths:
      - 'ecommerce-app/**'

jobs:
  unit-tests:
    name: Unit Tests (Jest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecommerce-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ecommerce-app/coverage/

  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ecommerce-api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ecommerce-app
        run: npm ci

      - name: Start backend and run seed
        working-directory: ecommerce-api
        run: npm run seed && npm run dev &
        env:
          MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_TOKEN: ${{ secrets.JWT_REFRESH_TOKEN }}
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: 4000

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:4000/api/products --timeout 30000

      - name: Run Cypress E2E tests
        working-directory: ecommerce-app
        run: npm run test:all
        env:
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ecommerce-app/cypress/screenshots/
